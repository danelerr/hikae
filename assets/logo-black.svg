<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <title>Hikae</title>
  <!-- A ring split along the diagonal; the halves step apart and a bar takes the gap: a share held back. -->
  <defs>
    <clipPath id="upper"><polygon points="0,0 512,0 0,512"/></clipPath>
    <clipPath id="lower"><polygon points="512,0 512,512 0,512"/></clipPath>
  </defs>
  <g fill="none" stroke="#111111" stroke-width="58">
    <circle cx="256" cy="256" r="122" clip-path="url(#upper)" transform="translate(-20 -20)"/>
    <circle cx="256" cy="256" r="122" clip-path="url(#lower)" transform="translate(20 20)"/>
  </g>
  <rect x="236" y="38" width="40" height="436" rx="2" fill="#111111" transform="rotate(45 256 256)"/>
</svg>
